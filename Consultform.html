<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Consultation | LT&O Consultant PTY LTD</title>
  <link rel="stylesheet" href="consult.css">
</head>

<body>

<!-- BACK BUTTON -->
<a href="altservice.html" class="back-btn">← Back</a>

<!-- MAIN WRAPPER -->
<div class="container">

  <h1>Book a Consultation</h1>
  <p class="subtitle">Fill in your details below and we will contact you shortly.</p>

 <form class="consult-form" action="https://formspree.io/f/mvgernya" method="POST">

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Enter your name" required>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" name="phone" placeholder="Enter your phone number" required>
    </div>

    <div class="form-group">
      <label>Type of Service</label>
      <select name="service" required>
        <option value="">Select Service</option>
        <option>Safety Compliance</option>
        <option>Fire Protection Services</option>
        <option>Transformer Maintenance</option>
        <option>ISO & IMS Implementation</option>
        <option>General Enquiry</option>
      </select>
    </div>

    <div class="form-group">
      <label>Your Message</label>
      <textarea name="message" placeholder="Describe your request..." required></textarea>
    </div>

    <!-- ✅ Add redirect here -->
    <input type="hidden" name="_redirect" value="thankyou.html">

    <button type="submit" class="submit-btn">Submit Consultation Request</button>

</form>


</div>

</body>
</html>
